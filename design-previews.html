<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>此镜 v2 独立方向预览</title>
    <link rel="stylesheet" href="./preview-styles.css" />
  </head>
  <body>
    <div class="mirror-cursor" aria-hidden="true">
      <span class="cursor-ring"></span>
      <span class="cursor-dot"></span>
      <span class="cursor-seal">镜</span>
    </div>
    <main class="mirror-room" data-step="idle">
      <canvas class="field-canvas" aria-hidden="true"></canvas>
      <div class="surface-noise" aria-hidden="true"></div>

      <aside class="side-rail">
        <p class="brand">此镜</p>
        <nav aria-label="模式">
          <button class="active" type="button" data-mode="塔罗" data-tone="tarot">塔罗</button>
          <button type="button" data-mode="梅花" data-tone="meihua">梅花</button>
          <button type="button" data-mode="当下" data-tone="anchor">当下</button>
        </nav>
      </aside>

      <section class="mirror-stage" aria-label="主视觉">
        <button class="mirror-disc" type="button" data-next="compose" aria-label="开始">
          <span class="disc-core"></span>
          <span class="disc-glass"></span>
          <span class="disc-ticks"></span>
          <span class="disc-ring ring-a"></span>
          <span class="disc-ring ring-b"></span>
          <span class="disc-text">照见</span>
        </button>
        <p class="mode-label" data-current-mode>塔罗</p>
      </section>

      <section class="copy-block idle-copy">
        <p>RILL / ONE ACTION</p>
        <h1>把心里的噪声，压成今晚能做的一件事。</h1>
      </section>

      <section class="work-panel compose-panel">
        <button class="panel-close" type="button" data-next="idle">×</button>
        <span class="panel-index">01</span>
        <p class="panel-kicker">写一句就够了</p>
        <div class="question" contenteditable="true" spellcheck="false">我最近总是睡不着，不知道真正烦的是什么。</div>
        <button class="primary" type="button" data-next="answer">照一下</button>
      </section>

      <section class="work-panel answer-panel">
        <button class="panel-close" type="button" data-next="compose">←</button>
        <span class="panel-index">02</span>
        <p class="panel-kicker">一句建议</p>
        <h2 data-answer>今晚睡前，只写下最反复出现的那个念头，不解释。</h2>
        <button class="primary" type="button" data-cycle>换一句</button>
      </section>
    </main>

    <script>
      const room = document.querySelector(".mirror-room");
      const cursor = document.querySelector(".mirror-cursor");
      const modeLabel = document.querySelector("[data-current-mode]");
      const answer = document.querySelector("[data-answer]");
      const answers = [
        "今晚睡前，只写下最反复出现的那个念头，不解释。",
        "把明天第一件小事写下来，别让它留在脑子里转。",
        "先发一句事实，不急着证明你的感受。",
        "今晚只保留一件必须做的事，其余写进明天。"
      ];

      document.querySelectorAll("[data-next]").forEach((button) => {
        button.addEventListener("click", () => {
          room.dataset.step = button.dataset.next;
        });
      });

      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-mode]").forEach((item) => item.classList.toggle("active", item === button));
          modeLabel.textContent = button.dataset.mode;
          room.dataset.mode = button.dataset.mode;
          room.dataset.tone = button.dataset.tone;
        });
      });

      window.addEventListener("pointermove", (event) => {
        const x = event.clientX / window.innerWidth;
        const y = event.clientY / window.innerHeight;
        room.style.setProperty("--mx", `${x * 100}%`);
        room.style.setProperty("--my", `${y * 100}%`);
        room.style.setProperty("--tilt-x", `${(0.5 - y) * 7}deg`);
        room.style.setProperty("--tilt-y", `${(x - 0.5) * 9}deg`);
        cursor.style.setProperty("--cursor-x", `${event.clientX}px`);
        cursor.style.setProperty("--cursor-y", `${event.clientY}px`);
      });

      window.addEventListener("pointerdown", () => cursor.classList.add("is-down"));
      window.addEventListener("pointerup", () => cursor.classList.remove("is-down"));

      document.querySelectorAll("button, [contenteditable='true']").forEach((target) => {
        target.addEventListener("pointerenter", () => cursor.classList.add("is-hover"));
        target.addEventListener("pointerleave", () => cursor.classList.remove("is-hover"));
      });

      document.querySelector("[data-cycle]").addEventListener("click", (event) => {
        const next = (Number(event.currentTarget.dataset.index || 0) + 1) % answers.length;
        event.currentTarget.dataset.index = String(next);
        answer.textContent = answers[next];
      });

      const canvas = document.querySelector(".field-canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;
      const particles = Array.from({ length: 130 }, () => ({
        x: Math.random(),
        y: Math.random(),
        a: Math.random() * Math.PI * 2,
        r: Math.random() * 2.2 + 0.4,
        v: Math.random() * 0.42 + 0.08
      }));

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function draw(time) {
        ctx.clearRect(0, 0, width, height);
        const cx = width * 0.52;
        const cy = height * 0.5;

        for (let i = 0; i < 11; i++) {
          ctx.strokeStyle = `rgba(226, 214, 190, ${0.035 + i * 0.006})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let angle = 0; angle <= Math.PI * 2 + 0.08; angle += 0.08) {
            const wave = Math.sin(angle * 4 + time / 1400 + i) * (16 + i * 2);
            const radius = 120 + i * 42 + wave;
            const x = cx + Math.cos(angle + time / 18000) * radius * 1.18;
            const y = cy + Math.sin(angle) * radius * 0.72;
            if (angle === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        particles.forEach((p) => {
          const x = (p.x * width + Math.sin(time / 2600 + p.a) * 34 + width) % width;
          const y = (p.y * height + Math.cos(time / 3000 + p.a) * 22 + height) % height;
          ctx.fillStyle = `rgba(250, 244, 230, ${0.04 + p.v * 0.18})`;
          ctx.beginPath();
          ctx.arc(x, y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw(0);
    </script>
  </body>
</html>
