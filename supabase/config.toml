# Supabase project config for AskAura.
# Link this workspace only to the dedicated AskAura Supabase project.
project_id = "askaura"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = false

[functions]
# Anonymous frontend calls are intentional for the current public reading flow.

[functions.reading]
verify_jwt = false

[functions.tarot-draw]
verify_jwt = false

[functions.admin-config]
verify_jwt = false

[functions.share-link]
verify_jwt = false

[functions.resonance-pool]
verify_jwt = false

[functions.billing-webhook]
verify_jwt = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
